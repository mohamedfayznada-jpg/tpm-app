<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FACTORY OS | V5.0</title>
    
    <!-- خطوط جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- مكتبة الأيقونات الاحترافية (بديل الإيموجي) -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <!-- ملف التنسيق الأساسي -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div class="app-container">
        
        <!-- القائمة الجانبية (Sidebar) -->
        <nav class="sidebar" id="mainSidebar">
            <div class="sidebar-header">
                <i class='bx bx-cog bx-spin' style="color: var(--gold);"></i> FACTORY OS
            </div>

            <!-- أزرار القائمة بأيقونات عصرية -->
            <div class="nav-btn active" onclick="showScreen('homeScreen'); setActive(this)">
                <i class='bx bx-grid-alt'></i> لوحة القيادة
            </div>
            <div class="nav-btn" onclick="showJHPortal(); setActive(this)">
                <i class='bx bx-wrench'></i> الصيانة الذاتية
            </div>
            <div class="nav-btn" onclick="showScreen('tagsScreen'); renderTags(); setActive(this)">
                <i class='bx bx-purchase-tag-alt'></i> التاجات والمشكلات
            </div>
            <div class="nav-btn" onclick="showScreen('tasksScreen'); renderTasks(); setActive(this)">
                <i class='bx bx-task'></i> المهام والتحسين
            </div>
            <div class="nav-btn" onclick="showScreen('kkScreen'); renderKKDashboard(); setActive(this)">
                <i class='bx bx-trending-down'></i> شجرة الفواقد
            </div>
            <div class="nav-btn" onclick="showScreen('knowledgeScreen'); renderKnowledgeShelves(); setActive(this)">
                <i class='bx bx-brain'></i> عقل المصنع
            </div>
            
            <div style="flex:1;"></div> <!-- مسافة لدفع الإعدادات للأسفل -->
            
            <div class="nav-btn" onclick="openMyFullProfile(); setActive(this)">
                <i class='bx bx-user-circle'></i> مركزي الشخصي
            </div>
            <div class="nav-btn" onclick="toggleDarkMode()">
                <i class='bx bx-moon'></i> المظهر
            </div>
        </nav>

        <!-- منطقة العرض الرئيسية -->
        <main class="main-content">
            
            <!-- شاشة 1: لوحة القيادة الرئيسية (Dashboard) -->
            <div id="homeScreen" class="screen active">
                <div class="glass-card">
                    <h2 style="color: var(--gold); margin-bottom: 20px;">
                        <i class='bx bx-bar-chart-square'></i> النظرة العامة للمصنع
                    </h2>
                    <!-- هنا سيتم حقن الـ Grid الخاص بالأقسام من الجافاسكريبت -->
                    <div id="homeDeptGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;"></div>
                </div>
            </div>

            <!-- شاشة 2: تسجيل الدخول (Login) -->
            <div id="loginScreen" class="screen">
                <div class="glass-card" style="max-width: 400px; margin: 10vh auto; text-align: center;">
                    <i class='bx bx-fingerprint' style="font-size: 60px; color: var(--gold); margin-bottom: 15px;"></i>
                    <h2 style="margin-bottom: 20px;">بوابة الدخول الآمنة</h2>
                    <input type="text" id="loginUsername" class="form-control" placeholder="اسم المستخدم">
                    <input type="password" id="loginPassword" class="form-control" placeholder="كلمة المرور">
                    <button class="btn btn-primary" style="width: 100%;" onclick="login()">دخول للنظام <i class='bx bx-log-in-circle'></i></button>
                    <p id="cloudStatus" style="margin-top: 15px; font-size: 12px; color: var(--text-muted);"></p>
                </div>
            </div>

            <!-- باقي الشاشات سيتم بناؤها تباعاً بنفس النمط... -->
            
        </main>
    </div>

    <!-- كود بسيط لتغيير حالة زر القائمة النشط -->
    <script>
        function setActive(element) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }
    </script>
</body>
</html>
